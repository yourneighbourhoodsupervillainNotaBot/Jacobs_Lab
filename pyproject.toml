[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jacobs-lab"
version = "0.2.0"
description = "Recursive topology, folding computation, and laboratory instruments"
requires-python = ">=3.10"

dependencies = []

[project.optional-dependencies]
audio = [
"numpy",
]

plot = [
"matplotlib",
]

viz = [
"pyglet",
]

all = [
"numpy",
"matplotlib",
"pyglet",
]

dev = [
"pytest",
"hypothesis",
"ruff",
]

[project.scripts]
jacobs-lab = "jacobs_lab.__main__:main_entry"

[tool.setuptools.packages.find]
where = ["src"]